<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primary Caller — live board</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Primary Caller</h1>
      <p class="tagline">Government-primary grades · paper stakes · wire beats</p>
      <div id="meta" class="meta"></div>
    </header>
    <main>
      <section>
        <h2>Live board</h2>
        <div id="board" class="board"></div>
      </section>
      <section>
        <h2>Track record</h2>
        <pre id="track" class="track"></pre>
      </section>
      <section>
        <h2>Beat log</h2>
        <ul id="beats" class="beats"></ul>
      </section>
    </main>
    <footer>
      <p>API-driven · not hand-edited HTML · refresh pulls <code>/v1/board</code></p>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>

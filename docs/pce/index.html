<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contradiction Card #1 — PCE-2026-11-06-01</title>
  <meta name="description" content="PCE Card #1 — SKEPTIC REVIEW; USGS display-plane essay; weather Card #2 sidebar." />
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --line: #30363d; --link: #58a6ff; --accent: #3fb950; --warn: #d29922;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 system-ui, sans-serif; background: var(--bg); color: var(--text);
      max-width: 960px; margin-inline: auto; padding: 0 1.25rem 3rem; }
    header { padding: 1.25rem 0 0.75rem; border-bottom: 2px solid var(--accent); margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; }
    .lede { color: var(--muted); font-size: 0.92rem; }
    a { color: var(--link); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; margin: 0.75rem 0; }
    .badge { font-family: var(--mono); font-size: 0.72rem; padding: 0.12rem 0.4rem; border-radius: 4px; border: 1px solid var(--line); margin-right: 0.35rem; }
    .badge.open { color: var(--accent); border-color: var(--accent); }
    .badge.review { color: var(--warn); border-color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 0.5rem 0; }
    th, td { border: 1px solid var(--line); padding: 0.45rem 0.55rem; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .mono { font-family: var(--mono); font-size: 0.82rem; word-break: break-all; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); gap: 1rem; align-items: start; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    footer { margin-top: 2rem; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <div id="top-banner" class="card" style="margin-top: 1rem; border-left: 3px solid var(--accent);"></div>
  <header>
    <h1>Contradiction Card #1</h1>
    <p class="lede">Primary Contradiction Engine · Charter #5 · <span class="mono">PCE-2026-11-06-01</span></p>
  </header>
  <div id="main"></div>
  <footer>
    <p>Pairwise: <a href="data/usgs-pairwise-2026-11-06.json">usgs</a> ·
      <a href="data/weather-seismic-pairwise-2026-11-06.json">weather×seismic (Card #2 stub)</a> ·
      <a href="data/bls-pairwise-2026-11-06.json">bls footnote</a> ·
      <a href="data/energy-pairwise-2026-11-06.json">energy footnote</a> ·
      <a href="data/emdat-pairwise-2026-11-06.json">emdat pairwise</a> ·
      <a href="data/deliberation-excerpt-2026-11-06.md">deliberation</a></p>
    <p><code>incidents/PCE-2026-11-06-01.json</code> · <code id="api-line">…</code></p>
  </footer>
  <script>
(function () {
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  Promise.all([
    fetch('incidents/PCE-2026-11-06-01.json').then(function (r) { return r.ok ? r.json() : {}; }),
    fetch('data/usgs-pairwise-2026-11-06.json').then(function (r) { return r.ok ? r.json() : {}; }),
    fetch('data/emdat-pairwise-2026-11-06.json').then(function (r) { return r.ok ? r.json() : {}; })
  ]).then(function (triple) {
    var inc = triple[0];
    var up = triple[1];
    var em = triple[2];
    var lead = up.lead_event || {};
    var gate = inc.skeptic_gate || {};
    var open = inc.publish_allowed === true && gate.status === 'PASS';

    document.getElementById('api-line').textContent =
      'status ' + (inc.status || 'OPEN') + ' · publish_allowed ' + String(!!inc.publish_allowed);

    var label = open ? 'CONTRADICTION OPEN' : 'SKEPTIC REVIEW';
    document.getElementById('top-banner').innerHTML =
      '<strong>' + esc(label) + '</strong> — skeptic ' + esc(gate.status || 'FAIL') +
      ' · <span class="mono">nc75462637</span> display-plane · weather sidebar → Card #2 (m-341l1eip / m-gxyzz1av).';

    var prim = inc.primaries || [];
    var pa = prim[0] || {};
    var pb = prim[1] || {};

    document.getElementById('main').innerHTML =
      '<p><span class="badge ' + (open ? 'open' : 'review') + '">' + esc(label) + '</span> <span class="mono">nc75462637</span></p>' +
      '<div class="layout"><div>' +
      '<div class="card"><h2 style="margin-top:0">' + esc(inc.a1_headline || inc.title) + '</h2>' +
      '<p>' + esc(inc.summary) + '</p>' +
      '<table><thead><tr><th>Plane</th><th>Value</th><th>SHA-256</th></tr></thead><tbody>' +
      '<tr><td>' + esc(pa.label) + '</td><td>' + esc(pa.value) + '</td><td class="mono">' + esc(pa.snapshot_sha256) + '</td></tr>' +
      '<tr><td>' + esc(pb.label) + '</td><td>' + esc(pb.value) + '</td><td class="mono">' + esc(pb.snapshot_sha256) + '</td></tr>' +
      '</tbody></table></div>' +
      '<h2>BLS integrity (footnote only)</h2><div class="card"><p class="lede">' +
      esc((inc.bls_integrity_footnote || {}).note || 'Mac/hosted claims.nr0 403 — see bls-pairwise + bls-live-fetch.') +
      ' · <a href="data/bls-pairwise-2026-11-06.json">bls-pairwise</a></p></div>' +
      '<h2>Energy / WPSR (footnote only)</h2><div class="card"><p class="lede">WPSR summary vs table1 aligned; <code>contradiction_open: false</code> — ' +
      '<a href="data/energy-pairwise-2026-11-06.json">energy-pairwise</a> · <a href="data/energy-macro-pairwise-2026-11-06.json">energy-macro</a>. Not Card #1 hero.</p></div>' +
      '<h2>EM-DAT catalog revision (annex severity 4)</h2><div class="card"><p class="lede">' +
      (em.hero_entity ? ('Hero <span class="mono">' + esc(em.hero_entity.disno) + '</span>: deaths ' +
      esc(em.hero_entity.value_v11) + ' (v1.1 tab) vs ' + esc(em.hero_entity.value_v20) + ' (v2.0 xlsx). ') : '') +
      'Skeptic <span class="badge review">FAIL OPEN</span> <span class="mono">pce-emdat-vintage-2023-0636-AFG</span> (m-vt3t9tp4) — catalog vintage, not cross-agency lede.' +
      '</p><p><a href="data/emdat-pairwise-2026-11-06.json">emdat-pairwise</a> · ' +
      '<a href="data/emdat-contradiction-card-candidate-2026-11-06.json">card candidate</a></p></div>' +
      '<div class="card"><p><a href="data/deliberation-excerpt-2026-11-06.md">deliberation-excerpt</a></p></div>' +
      '</div><aside><h2 style="margin-top:0">Card #2 stub</h2><div class="card">' +
      '<p class="lede">Weather×seismic NTWC 4.5 vs USGS 4.96 — <a href="incidents/PCE-2026-11-06-02.json">PCE-2026-11-06-02</a> under review until skeptic PASS.</p></div></aside></div>';
  }).catch(function (e) {
    document.getElementById('main').innerHTML = '<p class="lede">' + esc(e.message) + '</p>';
  });
})();
  </script>
</body>
</html>

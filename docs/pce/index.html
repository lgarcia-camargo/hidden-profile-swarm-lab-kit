<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contradiction Card #1 — PCE-2026-11-06-01</title>
  <meta name="description" content="Primary Contradiction Engine: two official USGS magnitudes, timestamped." />
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --line: #30363d; --link: #58a6ff; --accent: #f0883e; --warn: #d29922;
      --fail: #f85149; --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.55 system-ui, sans-serif; background: var(--bg); color: var(--text);
      max-width: 900px; margin-inline: auto; padding: 0 1.25rem 3rem; }
    header { padding: 1.25rem 0 0.75rem; border-bottom: 2px solid var(--accent); margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; margin: 0 0 0.35rem; }
    h2 { font-size: 1.05rem; margin: 1.25rem 0 0.5rem; }
    .lede { color: var(--muted); font-size: 0.92rem; }
    a { color: var(--link); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem; margin: 0.75rem 0; }
    .badge { font-family: var(--mono); font-size: 0.72rem; padding: 0.12rem 0.4rem; border-radius: 4px; border: 1px solid var(--line); margin-right: 0.35rem; }
    .badge.fail { color: var(--fail); border-color: var(--fail); }
    .badge.open { color: var(--warn); border-color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 0.5rem 0; }
    th, td { border: 1px solid var(--line); padding: 0.45rem 0.55rem; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .mono { font-family: var(--mono); font-size: 0.82rem; word-break: break-all; }
    .gate { border-left: 3px solid var(--fail); padding-left: 0.75rem; color: var(--muted); font-size: 0.9rem; }
    footer { margin-top: 2rem; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <p class="lede" style="margin-top:1rem"><a href="../index.html">← Lab home</a></p>
  <header>
    <h1>Contradiction Card #1</h1>
    <p class="lede">Primary Contradiction Engine · Charter #5 · <span id="card-id">PCE-2026-11-06-01</span></p>
  </header>
  <div id="gate-banner" class="card gate"></div>
  <div id="main"></div>
  <footer>
    <p>JSON: <code>incidents/PCE-2026-11-06-01.json</code> · Source: <code>contradiction-card-01-2026-11-06.md</code></p>
    <p><a href="data/usgs-pairwise-2026-11-06.json">usgs-pairwise</a> · <a href="data/bls-pairwise-2026-11-06.json">bls-pairwise</a> · <a href="data/deliberation-excerpt-2026-11-06.md">deliberation</a></p>
  </footer>
  <script>
(function () {
  const INC = 'incidents/PCE-2026-11-06-01.json';
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  fetch(INC).then(r => r.json()).then(function (c) {
    document.getElementById('card-id').textContent = c.card_id;
    var gate = document.getElementById('gate-banner');
    if (c.publish_allowed === false) {
      gate.innerHTML = '<strong>Publish gated</strong> — skeptic PASS required (current: <span class="badge fail">FAIL</span> on ' +
        esc(c.skeptic_gate && c.skeptic_gate.checks && c.skeptic_gate.checks[0] && c.skeptic_gate.checks[0].id) + '). Draft HTML for integrator/API handoff only.';
    } else if (c.skeptic_gate && c.skeptic_gate.status === 'PASS') {
      gate.innerHTML = '<strong>Skeptic PASS</strong> — Card #1 cleared for publish (display-plane mismatch lede).';
    }
    var prim = (c.primaries || []).map(function (p) {
      return '<tr><td>' + esc(p.label) + '</td><td class="mono">' + esc(p.field) + '</td><td><strong>' + esc(p.value) + '</strong></td>' +
        '<td><a href="' + esc(p.url) + '">' + esc(p.url.replace(/^https:\\/\\//,'')) + '</a></td>' +
        '<td class="mono">' + esc(p.snapshot_sha256 && p.snapshot_sha256.slice(0,16)) + '…</td></tr>';
    }).join('');
    var sg = c.secondary_gap || {};
    document.getElementById('main').innerHTML =
      '<p><span class="badge open">' + esc(c.status) + '</span> <span class="badge">' + esc(c.severity) + '</span> ' +
      esc(c.competition_id) + ' · observed ' + esc(c.detected_at_utc) + '</p>' +
      '<div class="card"><h2 style="margin-top:0">A1 — ' + esc(c.a1_headline) + '</h2>' +
      '<p>Lead <span class="mono">' + esc(c.lead_event_id) + '</span> · ' + esc(c.lead_place) + ' · origin ' + esc(c.origin_utc) + '</p>' +
      '<p>' + esc(c.summary) + '</p>' +
      '<table><thead><tr><th>Plane</th><th>Field</th><th>Magnitude</th><th>Source</th><th>Hash</th></tr></thead><tbody>' + prim + '</tbody></table></div>' +
      '<h2>Secondary gap — feed roll-off</h2><div class="card"><p><span class="mono">' + esc(sg.event_id) + '</span> · ' + esc(sg.place) +
      ' — absent from <code>4.5_day</code> while <code>detail/' + esc(sg.event_id) + '.geojson</code> still serves mag ' + esc(sg.mag) + '.</p>' +
      '<p class="mono">detail SHA-256: ' + esc(sg.detail_sha256) + '</p></div>' +
      '<h2>Method credibility (EM-DAT)</h2><div class="card"><p>v1.1→v2.0 earthquakes: <strong>' + esc(c.credibility_box && c.credibility_box.material_revisions) +
      '</strong> material revisions / ' + esc(c.credibility_box && c.credibility_box.overlapping_records) + ' overlapping · ' +
      '<a href="' + esc(c.credibility_box && c.credibility_box.doi) + '">Dataverse DOI</a></p></div>' +
      '<h2>BLS integrity callout (not lede)</h2><div class="card"><p>' + esc(c.bls_integrity_callout && c.bls_integrity_callout.note) + '</p></div>' +
      '<h2>Deliberation excerpt</h2><div class="card"><p>' + esc(c.deliberation_excerpt && c.deliberation_excerpt.text) +
      '</p><p class="lede">Full mesh log: <a href="data/deliberation-excerpt-2026-11-06.md">deliberation-excerpt-2026-11-06.md</a></p></div>';
  }).catch(function (e) {
    document.getElementById('main').innerHTML = '<p class="lede">Load error: ' + esc(e.message) + '</p>';
  });
})();
  </script>
</body>
</html>

name: verify-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

jobs:
  curl-hero-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages propagation
        run: |
          chmod +x scripts/verify_pages.sh
          VERIFY_PAGES_ATTEMPTS=18 VERIFY_PAGES_SLEEP=20 ./scripts/verify_pages.sh

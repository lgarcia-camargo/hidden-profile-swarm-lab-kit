name: score-predictions

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score open prediction ledger (read-only primary fetches)
        run: python3 scripts/score_open_ledger.py
      - name: Show summary
        run: |
          ls -la public-predictions/scores-*.json | tail -3
          python3 -c "import json,glob; p=sorted(glob.glob('public-predictions/scores-*.json'))[-1]; d=json.load(open(p)); print('scored_at', d['scored_at_utc']); [print(x['prediction_id'], x['status']) for x in d['predictions']]"

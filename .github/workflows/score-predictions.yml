name: score-predictions

on:
  schedule:
    # Every 30 minutes — refresh scores committed for GitHub Pages
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public-predictions/**"
      - "scripts/score_open_ledger.py"
      - ".github/workflows/score-predictions.yml"

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score open prediction ledger (read-only primary fetches)
        run: python3 scripts/score_open_ledger.py
      - name: Publish scores to GitHub Pages data path
        run: |
          mkdir -p docs/data
          LATEST=$(ls -t public-predictions/scores-*.json | head -1)
          cp "$LATEST" docs/data/live-scores.json
          cp "$LATEST" docs/data/latest-scores.json
          python3 -c "
          import json, pathlib
          reg = pathlib.Path('docs/data/registration.json')
          if not reg.exists():
              reg.write_text(json.dumps({
                  'registration_utc': '2026-11-05T21:55:00Z',
                  'registration_commit': '54b3797e7a2478a0a0963f44975ea8cb99864196',
                  'registration_commit_short': '54b3797',
                  'ledger_discussion': 'https://github.com/lgarcia-camargo/hidden-profile-swarm-lab-kit/discussions/2',
                  'primary_sources_only': True,
              }, indent=2) + '\n')
          "
      - name: Commit live scores for Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live-scores.json docs/data/latest-scores.json public-predictions/scores-*.json
          if git diff --staged --quiet; then
            echo "No score changes to commit."
            exit 0
          fi
          git commit -m "chore(pages): refresh live prediction scores [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            sleep 3
          done
          echo "Push failed after retries"
          exit 1

name: verify-results

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verify_results.py
        run: python3 scripts/verify_results.py
      - name: Offline scorer unit tests
        run: python3 scripts/test_score_open_ledger_offline.py

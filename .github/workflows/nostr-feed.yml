name: nostr-feed

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preregister, outcome, or kalshi-divergence
        required: true
        default: preregister
  # Charter stand-down (2026-11-06): no scheduled Nostr posts — workflow_dispatch only.
  # Life support: predictions-live + score-predictions unchanged.

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nostr-sdk
      - name: Publish to Nostr relays
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          NOSTR_MODE: ${{ github.event.inputs.mode || 'outcome' }}
        run: python3 scripts/publish_nostr.py | tee nostr-out.json
      - name: Upload nostr URLs artifact
        uses: actions/upload-artifact@v4
        with:
          name: nostr-urls
          path: nostr-out.json
